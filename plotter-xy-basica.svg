<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Plotter XY básica sem redutor</title>
  <desc id="desc">Vista superior de uma plotter com um motor NEMA 17 movendo o eixo X por correia e outro movendo o eixo Y por correia. Uma caneta fica no carro central.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc6d19"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #536174; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .frame { fill: #edf2f7; stroke: #66788f; stroke-width: 5; }
      .rail { stroke: #8898a9; stroke-width: 11; stroke-linecap: round; }
      .belt { stroke: #dc6d19; stroke-width: 5; stroke-dasharray: 10 6; fill: none; }
      .leader { stroke: #6b7788; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="45" y="55" class="title">Plotter XY: desenho mais simples</text>
  <text x="45" y="84" class="subtitle">Vista de cima • dois NEMA 17 giram polias diretamente, sem redutor</text>

  <!-- Área e estrutura -->
  <rect x="190" y="135" width="585" height="455" rx="12" class="frame"/>
  <rect x="300" y="200" width="390" height="315" fill="#fffdf5" stroke="#d4cabb" stroke-width="2"/>
  <text x="593" y="498" class="small" fill="#7c7465">papel</text>
  <line x1="265" y1="155" x2="265" y2="565" class="rail"/>
  <line x1="725" y1="155" x2="725" y2="565" class="rail"/>
  <text x="734" y="325" class="small" transform="rotate(90 734 325)">guia Y</text>

  <!-- Correia Y e motor -->
  <circle cx="220" cy="169" r="17" fill="#fff" stroke="#dc6d19" stroke-width="4"/>
  <circle cx="220" cy="548" r="17" fill="#fff" stroke="#dc6d19" stroke-width="4"/>
  <line x1="203" y1="169" x2="203" y2="548" class="belt"/>
  <line x1="237" y1="169" x2="237" y2="548" class="belt"/>
  <rect x="155" y="532" width="48" height="48" rx="6" fill="#e9eef5" stroke="#44546b" stroke-width="3"/>
  <circle cx="179" cy="556" r="9" fill="#44546b"/>
  <path d="M87 585 L155 560" class="leader"/>
  <text x="35" y="610" class="label">Motor Y</text>
  <text x="35" y="635" class="small">move a travessa</text>

  <!-- Travessa móvel, guias e carro X -->
  <rect x="253" y="338" width="485" height="42" rx="7" fill="#cbd9e8" stroke="#4b6077" stroke-width="3"/>
  <line x1="290" y1="359" x2="700" y2="359" stroke="#8798ab" stroke-width="8"/>
  <rect x="222" y="329" width="55" height="59" rx="5" fill="#a7bbcf" stroke="#4b6077" stroke-width="3"/>
  <rect x="712" y="329" width="35" height="59" rx="5" fill="#a7bbcf" stroke="#4b6077" stroke-width="3"/>
  <path d="M283 411 L344 378" class="leader"/>
  <text x="344" y="426" class="small">travessa que desliza no Y</text>

  <!-- Correia X e motor -->
  <rect x="273" y="291" width="48" height="48" rx="6" fill="#e9eef5" stroke="#44546b" stroke-width="3"/>
  <circle cx="297" cy="315" r="10" fill="#fff" stroke="#dc6d19" stroke-width="4"/>
  <circle cx="689" cy="315" r="14" fill="#fff" stroke="#dc6d19" stroke-width="4"/>
  <line x1="297" y1="301" x2="689" y2="301" class="belt"/>
  <line x1="297" y1="329" x2="689" y2="329" class="belt"/>
  <path d="M269 265 L290 290" class="leader"/>
  <text x="173" y="250" class="label">Motor X</text>
  <text x="173" y="272" class="small">move a caneta</text>
  <rect x="465" y="325" width="72" height="66" rx="8" fill="#d2f0e1" stroke="#218b61" stroke-width="4"/>
  <circle cx="501" cy="357" r="15" fill="#fff" stroke="#218b61" stroke-width="4"/>
  <circle cx="501" cy="357" r="5" fill="#17243a"/>
  <text x="472" y="452" class="label" fill="#218b61">Caneta</text>
  <text x="452" y="475" class="small">servo sobe/desce</text>
  <path d="M502 440 L502 391" class="leader"/>

  <!-- Setas de movimento -->
  <line x1="577" y1="262" x2="650" y2="262" stroke="#1769aa" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="565" y="247" class="label" fill="#1769aa">X ↔</text>
  <line x1="804" y1="252" x2="804" y2="323" stroke="#1769aa" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="816" y="290" class="label" fill="#1769aa">Y ↕</text>

  <rect x="780" y="400" width="190" height="155" rx="10" fill="#f4f7fb" stroke="#c7d1dc"/>
  <text x="799" y="433" class="label">Como funciona</text>
  <text x="799" y="464" class="small">1. Motor X gira a polia</text>
  <text x="799" y="488" class="small">2. Correia puxa a caneta</text>
  <text x="799" y="512" class="small">3. Motor Y move a travessa</text>
  <text x="799" y="536" class="small">4. Servo encosta no papel</text>
</svg>
